openapi: 3.1.0
info:
  title: agent-wallet API
  version: "1.0.0"
  summary: The single contract between the minimal UI, the eval harness and the backend.
  description: >
    Data contracts v1. Every object carries an integer `schema_version`.
    Errors use RFC 7807 (`application/problem+json`). Authentication: `single` mode
    uses the owner token; `multi` mode uses a wallet session cookie. See
    `AGENT_WALLET_MODE`. A policy `deny` is not an HTTP error: it is a 200 response
    carrying a DecisionRecord. **The IPS can only be set from the preset list**
    (`PUT /policy` with a preset id and a fresh owner signature). No endpoint
    accepts an IPS body.
servers:
  - url: http://localhost:8000
tags:
  - name: orders
  - name: audit
  - name: state
  - name: owner
  - name: auth
  - name: agent
  - name: jobs
  - name: chat

paths:
  /orders:
    post:
      tags: [orders]
      operationId: submitOrder
      summary: Submit an order for policy evaluation and, if allowed, execution.
      description: >
        The order id is client-generated. The same id never executes twice:
        replaying the same body returns the stored latest record for that order;
        the same id with a different body is a 409 problem. In `multi` mode orders are
        proposed with `origin: planner`; `mint` and `transfer` are rejected there with
        `422 owner-only-function`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/order.schema.json" }
      responses:
        "200":
          description: Latest DecisionRecord for the order (denied, pending_approval, executed or failed).
          content:
            application/json:
              schema: { $ref: "schemas/decision-record.schema.json" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /orders/{order_id}/approve:
    post:
      tags: [owner]
      operationId: approveOrder
      summary: Approve a pending order (owner only). Appends a record.
      description: >-
        Multi mode: session cookie plus header `X-Step-Up` signed for action `approve` with
        params `{"order_id": <order_id>}`. Single mode: the owner token.
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      responses:
        "200":
          description: The appended DecisionRecord (executed or failed).
          content:
            application/json:
              schema: { $ref: "schemas/decision-record.schema.json" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /orders/{order_id}/reject:
    post:
      tags: [owner]
      operationId: rejectOrder
      summary: Reject a pending order (owner only). Appends a denied record with TIER.APPROVAL_REJECTED.
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      responses:
        "200":
          description: The appended DecisionRecord (denied).
          content:
            application/json:
              schema: { $ref: "schemas/decision-record.schema.json" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /decisions:
    get:
      tags: [audit]
      operationId: listDecisions
      summary: List audit records, sorted by seq ascending.
      description: >
        `seq` is assigned by the log, never by the caller.
        Paginate by passing the opaque `next_cursor` of the previous page as `cursor`.
      parameters:
        - name: order_id
          in: query
          schema: { type: string, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
        - name: outcome
          in: query
          schema: { type: string, enum: [no_action, denied, pending_approval, executed, failed] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Opaque cursor from a previous response.
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: One page of records.
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, items, next_cursor]
                additionalProperties: false
                properties:
                  schema_version: { type: integer, const: 1 }
                  items:
                    type: array
                    items: { $ref: "schemas/decision-record.schema.json" }
                  next_cursor: { type: [string, "null"] }
        "422": { $ref: "#/components/responses/Problem" }
  /portfolio:
    get:
      tags: [state]
      operationId: getPortfolio
      summary: Current agent wallet snapshot.
      responses:
        "200":
          description: Portfolio state.
          content:
            application/json:
              schema: { $ref: "schemas/portfolio-state.schema.json" }
  /ips:
    get:
      tags: [state]
      operationId: getIps
      summary: Read the active IPS and its hash. There is no write endpoint.
      responses:
        "200":
          description: The IPS and the SHA-256 of its canonical JSON.
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, ips, ips_hash]
                additionalProperties: false
                properties:
                  schema_version: { type: integer, const: 1 }
                  ips: { $ref: "schemas/ips.schema.json" }
                  ips_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
  /tier:
    get:
      tags: [state]
      operationId: getTier
      summary: Current tier and emergency stop flag.
      responses:
        "200":
          description: Tier state.
          content:
            application/json:
              schema: { $ref: "schemas/tier-state.schema.json" }
    put:
      tags: [owner]
      operationId: setTier
      summary: Set the tier (owner only). The agent has no path to this endpoint.
      description: >-
        Multi mode: session cookie; raising the tier (T0 to T1, T1 to T2, T0 to T2) also needs
        header `X-Step-Up` signed for action `tier_raise` with params `{"tier": <new tier>}`;
        lowering needs the session only. Single mode: the owner token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schema_version, tier]
              additionalProperties: false
              properties:
                schema_version: { type: integer, const: 1 }
                tier: { type: string, enum: [T0, T1, T2] }
                preset_id:
                  type: string
                  enum: [conservative, diversified]
                  description: Optional IPS preset to activate. Default is conservative.
      responses:
        "200":
          description: The new tier state.
          content:
            application/json:
              schema: { $ref: "schemas/tier-state.schema.json" }
        "422": { $ref: "#/components/responses/Problem" }
  /emergency-stop:
    post:
      tags: [owner]
      operationId: engageEmergencyStop
      summary: Engage the emergency stop (owner only). Appends a no_action record with TIER.EMERGENCY_STOP.
      responses:
        "200":
          description: The appended DecisionRecord.
          content:
            application/json:
              schema: { $ref: "schemas/decision-record.schema.json" }
        "409": { $ref: "#/components/responses/Problem" }
  /emergency-stop/release:
    post:
      tags: [owner]
      operationId: releaseEmergencyStop
      summary: Release the emergency stop (owner only). Appends a no_action record with TIER.EMERGENCY_STOP_RELEASED.
      description: >-
        Multi mode: session cookie plus header `X-Step-Up` signed for action `release_stop`
        with params `{}`. Single mode: the owner token.
      responses:
        "200":
          description: The appended DecisionRecord.
          content:
            application/json:
              schema: { $ref: "schemas/decision-record.schema.json" }
        "409": { $ref: "#/components/responses/Problem" }
  /eval/report:
    get:
      tags: [audit]
      operationId: getEvalReport
      summary: Latest eval report. Loose envelope in v1; frozen when S6 starts.
      responses:
        "200":
          description: Eval report.
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, generated_at, metrics, scenarios]
                properties:
                  schema_version: { type: integer, const: 1 }
                  generated_at: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,6})?Z$" }
                  metrics:
                    type: object
                    description: Metric name to value (integers in basis points or counts).
                    additionalProperties: { type: integer }
                  scenarios:
                    type: array
                    items:
                      type: object
                      required: [id, layer, passed]
                      properties:
                        id: { type: string, pattern: "^(AM|SEC|CMP)-[0-9]{2}$" }
                        layer: { type: string, enum: [A, B, C] }
                        passed: { type: boolean }
                        rule_codes:
                          type: array
                          items: { type: string, pattern: "^[A-Z]+\\.[A-Z0-9_]+$" }
                        tx_hash: { type: [string, "null"], pattern: "^0x[0-9a-f]{64}$" }
        "404": { $ref: "#/components/responses/Problem" }

  /auth/nonce:
    post:
      tags: [auth]
      operationId: authNonce
      summary: Issue a single-use sign-in nonce and the exact message to sign.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              additionalProperties: false
              properties:
                address: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
      responses:
        "200":
          description: Nonce and message.
          content:
            application/json:
              schema:
                type: object
                required: [nonce, message, expires_at]
                properties:
                  nonce: { type: string, pattern: "^[0-9a-f]{40}$" }
                  message: { type: string, maxLength: 1000 }
                  expires_at: { $ref: "#/components/schemas/UtcTimestamp" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/verify:
    post:
      tags: [auth]
      operationId: authVerify
      summary: "Verify the wallet signature and start a session (Set-Cookie aw_session)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, nonce, signature]
              additionalProperties: false
              properties:
                address: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
                nonce: { type: string, pattern: "^[0-9a-f]{40}$" }
                signature: { type: string, pattern: "^0x[0-9a-fA-F]{130}$" }
      responses:
        "200":
          description: "Session started. `token` is present only when bearer clients are enabled."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionStarted" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Revoke the current session.
      security: [{ SessionCookie: [] }]
      responses:
        "200":
          description: Session revoked.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/step-up:
    post:
      tags: [auth]
      operationId: authStepUp
      summary: Issue a fresh-signature challenge for one named action.
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, params]
              additionalProperties: false
              properties:
                action: { type: string, enum: [release_stop, tier_raise, policy_change, withdraw, approve] }
                params: { type: object, additionalProperties: true }
      responses:
        "200":
          description: "Challenge. Send header X-Step-Up with value <challenge_id>.<signature> on the action request."
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id, message, expires_at]
                properties:
                  challenge_id: { type: string, pattern: "^[0-9a-f]{32}$" }
                  message: { type: string, maxLength: 1000 }
                  expires_at: { $ref: "#/components/schemas/UtcTimestamp" }
        "401": { $ref: "#/components/responses/Problem" }
  /me:
    get:
      tags: [auth]
      operationId: getMe
      security: [{ SessionCookie: [] }]
      responses:
        "200":
          description: Current owner.
          content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } }
        "401": { $ref: "#/components/responses/Problem" }
  /agent:
    get:
      tags: [agent]
      operationId: getAgent
      summary: Agent wallet address, live balances and the gas floor.
      security: [{ SessionCookie: [] }]
      responses:
        "200":
          description: Agent wallet state.
          content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } }
        "401": { $ref: "#/components/responses/Problem" }
  /topups:
    post:
      tags: [agent]
      operationId: registerTopup
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tx_hash]
              additionalProperties: false
              properties:
                tx_hash: { type: string, pattern: "^0x[0-9a-f]{64}$" }
      responses:
        "202":
          description: "Registered; poll GET /topups/{tx_hash}."
          content: { application/json: { schema: { $ref: "#/components/schemas/Topup" } } }
        "422": { $ref: "#/components/responses/Problem" }
  /topups/{tx_hash}:
    get:
      tags: [agent]
      operationId: getTopup
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: tx_hash, in: path, required: true, schema: { type: string, pattern: "^0x[0-9a-f]{64}$" } }
      responses:
        "200":
          description: Top-up status.
          content: { application/json: { schema: { $ref: "#/components/schemas/Topup" } } }
        "404": { $ref: "#/components/responses/Problem" }
  /agent/mint:
    post:
      tags: [agent]
      operationId: mintTestUsdc
      summary: Mint test USDC to the agent wallet through the gateway (testnet only; the faucet enforces its own limits).
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_usdc]
              additionalProperties: false
              properties:
                amount_usdc: { type: string, pattern: "^[1-9][0-9]{0,6}$", description: "Whole USDC, 1 to 9999999. No cap in our contract: the Aave faucet enforces its own on-chain maximum and cooldown." }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /agent/withdraw:
    post:
      tags: [agent]
      operationId: withdrawToOwner
      summary: "Transfer USDC or ETH from the agent wallet to the owner address. Needs a step-up signature."
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: X-Step-Up, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, amount]
              additionalProperties: false
              properties:
                token: { type: string, enum: [USDC, ETH] }
                amount: { $ref: "schemas/order.schema.json#/$defs/PositiveAmount" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /presets:
    get:
      tags: [state]
      operationId: listPresets
      responses:
        "200":
          description: Fixed list of presets shipped with the service.
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, items]
                properties:
                  schema_version: { type: integer, const: 1 }
                  items:
                    type: array
                    items:
                      type: object
                      required: [preset_id, title, summary, ips_hash, limits]
                      properties:
                        preset_id: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
                        title: { type: string }
                        summary: { type: string, description: "Plain-language description." }
                        ips_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
                        limits: { type: object, additionalProperties: { type: string } }
  /runs:
    post:
      tags: [jobs]
      operationId: startRun
      summary: Run one agent cycle (Reader, Planner, gateway) as a job.
      security: [{ SessionCookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: string, maxLength: 2000, description: "Untrusted text for the Reader." }
                planner: { type: string, enum: [auto, scripted_hostile], default: auto }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /chat:
    post:
      tags: [chat]
      operationId: sendChat
      summary: Hand the agent a task or ask it a question, as a job of kind chat.
      description: >-
        The message goes to the planner as the owner's instruction (an untrusted, separately
        labelled channel). The planner may propose an ordered list of orders; each goes through the
        gateway with `origin: planner`, so mint and transfer are impossible from chat. Execution
        stops at the first order that is not executed. Counts against the same hourly limit as
        `POST /runs`, and the one-active-job rule applies. Poll `GET /jobs/{job_id}`, then read
        `GET /chat`.
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 500 }
                thread_id:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Conversation to post into; absent is the default thread.
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
    get:
      tags: [chat]
      operationId: listChat
      summary: The owner's chat messages, oldest first, with the steps of each agent message.
      description: >-
        A step is rebuilt from the audit records of the message's job (never from model prose).
        The agent text is composed by code from the outcomes; a model `reply` appears directly
        and is never proof of an outcome.
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: thread_id, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 64 } }
      responses:
        "404": { $ref: "#/components/responses/Problem" }
        "200":
          description: Messages.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ChatMessage" }
        "401": { $ref: "#/components/responses/Problem" }
  /chat/threads:
    get:
      tags: [chat]
      operationId: listChatThreads
      summary: The owner's conversations, newest first, with the status of the latest job.
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: Threads.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ChatThread" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [chat]
      operationId: createChatThread
      summary: Open an empty conversation.
      description: >-
        The title starts as "New chat" and is set by code from the first 40 characters of the
        first owner message; the model never writes it.
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "201":
          description: Thread created.
          content:
            application/json:
              schema:
                type: object
                required: [id, title]
                properties:
                  id: { type: string }
                  title: { type: string, maxLength: 40 }
        "401": { $ref: "#/components/responses/Problem" }
  /chat/stream/{job_id}:
    get:
      tags: [chat]
      operationId: streamChatJob
      summary: Stream job progress events (phase and done) via Server-Sent Events.
      description: >-
        Returns a text/event-stream via Starlette StreamingResponse with Cache-Control:
        no-cache, no-transform and X-Accel-Buffering: no. Emits `phase` events on each
        job phase change and a final `done` event whose data equals the GET /jobs/{job_id}
        payload. A comment ping is emitted periodically. Client disconnect never cancels
        the job.
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{32}$" } }
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: Recent jobs of the session owner, newest first.
      security: [{ SessionCookie: [] }]
      responses:
        "200":
          description: Jobs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Problem" }
  /jobs/{job_id}:
    get:
      tags: [jobs]
      operationId: getJob
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{32}$" } }
      responses:
        "200":
          description: Job.
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        "404": { $ref: "#/components/responses/Problem" }
  /jobs/{job_id}/cancel:
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Stop a queued or running job before its next order.
      description: >-
        Accepted while the job is `queued` or `rules_check`. The job then ends `denied` with error
        code `OWNER_CANCELLED`; orders not yet proposed are recorded as skipped steps with reason
        `owner-cancelled`. An order already submitted is never undone, and cancel never calls the
        signer. `409 not-cancellable` once the job is `sent` or later, or finished.
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{32}$" } }
      responses:
        "202":
          description: Cancel accepted.
          content:
            application/json:
              schema:
                type: object
                required: [job_id, status]
                properties:
                  job_id: { type: string }
                  status: { type: string, enum: [cancelling] }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /chat/suggestions:
    get:
      tags: [chat]
      operationId: chatSuggestions
      summary: Suggested prompts chosen by code from the owner's state (no model call).
      security: [{ SessionCookie: [] }]
      responses:
        "200":
          description: Suggestions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [text, kind]
                      properties:
                        text: { type: string }
                        kind: { type: string, enum: [question, action] }
        "401": { $ref: "#/components/responses/Problem" }
  /limits:
    get:
      tags: [state]
      operationId: getLimits
      summary: The owner's active limits, today's spend and the stop flag. Read-only.
      security: [{ SessionCookie: [] }]
      responses:
        "200":
          description: Limits.
          content:
            application/json:
              schema:
                type: object
                required: [per_order_usd, per_day_usd, used_today_usd, approval_threshold_usd, protocols, emergency_stop, as_of]
                properties:
                  per_order_usd: { type: string }
                  per_day_usd: { type: string }
                  used_today_usd: { type: string }
                  approval_threshold_usd: { type: string }
                  protocols: { type: array, items: { type: string } }
                  emergency_stop: { type: string, enum: [ready, stopped] }
                  as_of: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
  /protocols:
    get:
      tags: [state]
      operationId: getProtocols
      summary: The registered protocols the owner's IPS enables. Read-only; no addresses.
      security: [{ SessionCookie: [] }]
      responses:
        "200":
          description: Enabled protocols.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, category, tokens, functions, paper]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        category: { type: string }
                        tokens: { type: array, items: { type: string } }
                        functions: { type: array, items: { type: string } }
                        paper: { type: boolean }
        "401": { $ref: "#/components/responses/Problem" }
  /audit/verify:
    get:
      tags: [audit]
      operationId: verifyAudit
      security: [{ SessionCookie: [] }]
      summary: Recompute the owner's hash chain on the server.
      responses:
        "200":
          description: Result.
          content:
            application/json:
              schema:
                type: object
                required: [ok, records, first_bad_seq]
                properties:
                  ok: { type: boolean }
                  records: { type: integer, minimum: 0 }
                  first_bad_seq: { type: [integer, "null"] }

components:
  securitySchemes:
    SessionCookie: { type: apiKey, in: cookie, name: aw_session }
    OwnerToken: { type: http, scheme: bearer }
  parameters:
    OrderId:
      name: order_id
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
  responses:
    JobAccepted:
      description: "Job accepted. Poll GET /jobs/{job_id}."
      content:
        application/json:
          schema:
            type: object
            required: [job_id, status]
            properties:
              job_id: { type: string, pattern: "^[0-9a-f]{32}$" }
              status: { type: string, enum: [queued] }
    Problem:
      description: >
        RFC 7807 problem. `type` is one of urn:agent-wallet:problem:invalid-request (422),
        not-found (404), order-id-conflict (409), not-pending (409),
        emergency-stop-state (409), unauthenticated (401), signature-invalid (401),
        step-up-required (401), csrf (403), owner-only-function (422), job-in-progress (409),
        rate-limited (429, `Retry-After`), custody-unavailable (503), gas-below-floor (409),
        stopped (409), service-unavailable (503).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    UtcTimestamp:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,6})?Z$"
    SessionStarted:
      type: object
      required: [address, expires_at]
      properties:
        address: { type: string, pattern: "^0x[0-9a-f]{40}$" }
        expires_at: { $ref: "#/components/schemas/UtcTimestamp" }
        token: { type: string, description: "Only when bearer clients are enabled (AGENT_WALLET_ALLOW_BEARER=1)." }
    Me:
      type: object
      required: [address, agent_address, mode, chain_id]
      properties:
        address: { type: string, pattern: "^0x[0-9a-f]{40}$" }
        agent_address: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        mode: { type: string, enum: [single, multi, replay] }
        chain_id: { type: integer, const: 84532 }
        tier: { type: string, enum: [T0, T1, T2] }
        emergency_stop: { type: boolean }
    TokenBalance:
      type: object
      description: "A balance in the smallest unit; unlike an order amount it may be zero."
      required: [value, decimals]
      properties:
        value: { type: string, pattern: "^[0-9]{1,30}$" }
        decimals: { type: integer, minimum: 0, maximum: 36 }
    Agent:
      type: object
      required: [address, eth_wei, gas_floor_wei, usdc, ausdc, price_source, custody]
      properties:
        address: { type: string }
        eth_wei: { type: string, pattern: "^[0-9]+$" }
        gas_floor_wei: { type: string, pattern: "^[0-9]+$" }
        suggested_topup_wei: { type: string, pattern: "^[0-9]+$" }
        usdc: { $ref: "#/components/schemas/TokenBalance" }
        ausdc: { $ref: "#/components/schemas/TokenBalance" }
        price_source: { type: string, const: mainnet_reference }
        custody: { type: string, const: "custodial-testnet" }
    Topup:
      type: object
      required: [tx_hash, status]
      properties:
        tx_hash: { type: string }
        status: { type: string, enum: [pending, confirmed, failed, rejected] }
        amount_wei: { type: string }
        block_number: { type: integer }
        explorer_url: { type: string }
    Job:
      type: object
      required: [job_id, kind, status, planner_client, order_ids, created_at]
      properties:
        job_id: { type: string }
        kind: { type: string, enum: [run, mint, withdraw, chat] }
        status: { type: string, enum: [queued, running, succeeded, denied, failed, interrupted] }
        planner_client: { type: string, enum: [openai, scripted, fallback, none] }
        order_ids: { type: array, items: { type: string }, description: "Ids only; fetch records from /decisions." }
        error_code: { type: [string, "null"] }
        phase: { type: string, description: "queued, rules_check, sent, confirming or done. Clients must tolerate unknown values." }
        created_at: { $ref: "#/components/schemas/UtcTimestamp" }
        finished_at: { type: [string, "null"] }
        records:
          type: array
          description: "Summaries of the audit records this job produced (GET /jobs/{job_id} only). The audit log stays the truth."
          items:
            type: object
            required: [seq, outcome, planner_client]
            properties:
              seq: { type: integer }
              order_id: { type: [string, "null"] }
              outcome: { type: string }
              function: { type: [string, "null"] }
              token: { type: [string, "null"] }
              amount: { type: [object, "null"] }
              rule_codes: { type: array, items: { type: string } }
              reason: { type: [string, "null"] }
              tx_hash: { type: [string, "null"] }
              planner_client: { type: string, enum: [openai, scripted, fallback, none] }
    ChatStep:
      type: object
      required: [order_id, function, token, amount, outcome, reason, rule_codes, tx_hash, explanation]
      properties:
        order_id: { type: [string, "null"] }
        function: { type: [string, "null"] }
        token: { type: [string, "null"] }
        amount: { type: [object, "null"] }
        outcome: { type: string, enum: [executed, denied, pending_approval, failed, skipped] }
        reason: { type: [string, "null"] }
        rule_codes: { type: array, items: { type: string } }
        tx_hash: { type: [string, "null"] }
        explanation: { type: string, description: "Plain sentence composed by code." }
    ChatMessage:
      type: object
      required: [id, role, text, job_id, created_at, steps]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, agent] }
        text: { type: string, maxLength: 4000 }
        job_id: { type: [string, "null"] }
        created_at: { $ref: "#/components/schemas/UtcTimestamp" }
        steps: { type: array, items: { $ref: "#/components/schemas/ChatStep" } }
        phase: { type: string, description: "Phase of the message's job (see Job). `done` for user messages." }
    ChatThread:
      type: object
      required: [id, title, last_message_at, status]
      properties:
        id: { type: string, description: "A thread id, or `default` for the implicit thread." }
        title: { type: string, maxLength: 40 }
        last_message_at: { $ref: "#/components/schemas/UtcTimestamp" }
        status: { type: string, enum: [running, pending, done, blocked] }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, pattern: "^urn:agent-wallet:problem:[a-z-]+$" }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, maxLength: 500 }
        instance: { type: string }
        errors:
          type: array
          description: Field-level validation failures for 422.
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
